filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Tag errors for easy filtering
  if [status_code] and [status_code] != 200 {
    mutate { add_tag => ["error"] }
  }
}

